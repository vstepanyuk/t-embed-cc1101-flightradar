[package]
edition      = "2024"
name         = "esp-radar"
version      = "0.1.0"

[[bin]]
name = "esp-radar"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["log-04", "esp32s3", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["log-04", "embassy", "esp-alloc", "esp-radio", "esp32s3"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["log-04", "esp32s3"] }

embassy-net = { version = "0.9.1", features = ["log", "dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["log-04", "esp32s3"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = { version = "2.1.1", features = ["nightly"] }
lcd-async = "0.1.3"
embassy-sync = "0.8.0"
micromath = "2.1.0"
embassy-embedded-hal = "0.6.0"
bevy_ecs = { version = "0.19.1", default-features = false, features = ["critical-section"] }
embedded-graphics = { version = "0.8.2", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi"] }
reqwless = { version = "0.14.0", default-features = false, features = ["embedded-tls", "rsa"] }
der = { version = "0.8.1", features = ["heapless"] }
log = { version = "0.4", default-features = false }
device-envoy-esp = { version = "0.1.4", default-features = false, features = ["esp32s3"] }
paste = "1.0"
embassy-futures = "0.1.2"
json-bourne = { version = "0.2.2", default-features = false, features = ["alloc", "derive"] }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "json", "log"] }
serde = { version = "1.0.229", features = ["derive"], default-features = false }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
