# Project-wide formatting for the nightly toolchain used by esp-radar.
edition = "2024"
style_edition = "2024"

# Keep imports deterministic and grouped as std, external crates, then crate-local.
reorder_imports = true
reorder_modules = true
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

max_width = 100
use_small_heuristics = "Max"
newline_style = "Unix"
format_code_in_doc_comments = true
